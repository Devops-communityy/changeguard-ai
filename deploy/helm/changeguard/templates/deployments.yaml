apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeguard-ui
  labels:
    {{- include "changeguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: ui}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8501}]
          envFrom:
            - configMapRef: {name: changeguard-config}
            - secretRef: {name: {{ .Values.secretName }}}
          readinessProbe: {httpGet: {path: /_stcore/health, port: http}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /_stcore/health, port: http}, initialDelaySeconds: 30}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /app/data}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeguard-api
  labels:
    {{- include "changeguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [uvicorn, changeguard.api:app, --host, 0.0.0.0, --port, "8080"]
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: changeguard-config}
            - secretRef: {name: {{ .Values.secretName }}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /app/data}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
