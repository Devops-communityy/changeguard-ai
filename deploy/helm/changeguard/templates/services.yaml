apiVersion: v1
kind: Service
metadata: {name: changeguard-ui}
spec:
  selector: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: ui}
  ports: [{name: http, port: 8501, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: changeguard-api}
spec:
  selector: {app.kubernetes.io/name: changeguard, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
